name: CI

on:
  push:
  pull_request:

jobs:
  referee-and-agents:
    name: Python (referee, orchestrator, controller)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests

  firmware:
    name: Firmware host tests (gcc, no hardware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: >
          gcc -std=c11 -Wall -Wextra -Wno-unused-parameter -Werror
          -Itests/firmware -Ifirmware/Core/Inc
          tests/firmware/test_app.c firmware/Core/Src/gridtwin_app.c -lm -o fwtest
      - name: Run
        run: ./fwtest
